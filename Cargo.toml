[package]
name = "plugins-ext"
version = "0.1.0"
edition = "2024"

[lib]
name = "plugins_ext"
crate-type = ["cdylib"]

[dependencies]
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12.23", default-features = false, features = ["rustls-tls"] }
governor    = "0.10.1"
nonzero_ext = "0.3"
pyo3        = { version = "0.26.0", features = ["extension-module"] }
futures     = "0.3"
anyhow      = "1"
rand        = "0.9.2"